<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <!-- Icon: Interlocking Two People -->
  <g transform="translate(10, 10)">
    <!-- Left Person Head -->
    <circle cx="32" cy="22" r="10" fill="#0D9488"/>
    <!-- Right Person Head -->
    <circle cx="76" cy="22" r="10" fill="#0D9488"/>
    
    <!-- Left Person Body & Interlocking Arm -->
    <path d="M 22 42 C 14 50, 14 62, 24 72 L 40 88 C 50 98, 66 98, 76 88 C 84 80, 84 68, 76 60 L 64 48 C 60 44, 52 44, 48 48 C 44 52, 44 60, 48 64 L 60 76 C 64 80, 64 84, 60 88 C 56 92, 48 92, 44 88 L 28 72 C 22 66, 22 58, 28 52 Z" fill="#0D9488"/>

    <!-- Right Person Body & Interlocking Arm -->
    <path d="M 86 42 C 94 50, 94 62, 84 72 L 68 88 C 58 98, 42 98, 32 88 C 24 80, 24 68, 32 60 L 44 48 C 48 44, 56 44, 60 48 C 64 52, 64 60, 60 64 L 48 76 C 44 80, 44 84, 48 88 C 52 92, 60 92, 64 88 L 80 72 C 86 66, 86 58, 80 52 Z" fill="#0D9488" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <!-- "Project" in Bold Dark Charcoal (#0F172A) -->
  <text x="125" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#0F172A" letter-spacing="-1">Project</text>
  <!-- "Match" in Vibrant Teal (#0D9488) -->
  <text x="300" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="500" fill="#0D9488" letter-spacing="-1">Match</text>
</svg>
